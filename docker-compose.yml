version: '3.8'

services:
  # ─── 1. PostgreSQL Database ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: openbot-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openbot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbot_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-openbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbot_user} -d ${POSTGRES_DB:-openbot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 2. Redis Cache & Queue ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: openbot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 3. Ollama Zero-Cloud Inference Engine ────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: openbot-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 4. OpenBot AI Engine (Inference & Routing) ───────────────
  ai-engine:
    build:
      context: .
      dockerfile: services/ai-engine/Dockerfile
    container_name: openbot-ai-engine
    restart: always
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openbot_user}:${POSTGRES_PASSWORD:-openbot_secret_password}@postgres:5432/${POSTGRES_DB:-openbot}?schema=public
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── 5. OpenBot API Gateway (Auth, Conversations, Skills) ─────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: openbot-api-gateway
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openbot_user}:${POSTGRES_PASSWORD:-openbot_secret_password}@postgres:5432/${POSTGRES_DB:-openbot}?schema=public
      - REDIS_URL=redis://redis:6379
      - AI_ENGINE_URL=http://ai-engine:4001
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_key_change_in_prod}
      - ADB_HOST=phone-bridge
      - ADB_PORT=5037
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_started

  # ─── 6. OpenBot Web UI & Next.js Agent App ────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: openbot-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openbot_user}:${POSTGRES_PASSWORD:-openbot_secret_password}@postgres:5432/${POSTGRES_DB:-openbot}?schema=public
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
      - ADB_HOST=phone-bridge
      - ADB_PORT=5037
      - NEXT_PUBLIC_DOCKER_OS_URL=http://localhost:6080
      - NEXT_PUBLIC_DOCKER_BROWSER_URL=http://localhost:3002
      - NEXT_PUBLIC_PHONE_STREAM_URL=http://localhost:8000/stream
    depends_on:
      api-gateway:
        condition: service_started

  # ─── 7. Dockerized OS Desktop Sandbox (Full Ubuntu GUI + noVNC) ────
  os-desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: openbot-os-desktop
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUBFOLDER=/
      - TITLE=OpenBot OS Desktop
    ports:
      - "6080:3000"
    volumes:
      - os_desktop_data:/config
      - ../..:/workspace

  # ─── 8. Dockerized Browser Sandbox (Chromium + CDP + Remote Playwright)
  browser-sandbox:
    image: browserless/chrome:latest
    container_name: openbot-browser-sandbox
    restart: unless-stopped
    ports:
      - "3002:3000"
      - "9222:9222"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=600000
      - CHROME_REFRESH_TIME=3600000
      - DEFAULT_BLOCK_ADS=true

  # ─── 9. Dockerized Phone Bridge (Physical USB ADB + Wireless ADB + Screen Stream)
  phone-bridge:
    build:
      context: ./docker/phone-bridge
      dockerfile: Dockerfile
    container_name: openbot-phone-bridge
    restart: unless-stopped
    privileged: true
    ports:
      - "5037:5037"
      - "5555:5555"
      - "8000:8000"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - WIRELESS_ADB_IP=${WIRELESS_ADB_IP:-}

volumes:
  postgres_data:
  redis_data:
  ollama_models:
  os_desktop_data:
