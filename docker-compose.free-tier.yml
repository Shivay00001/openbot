version: '3.8'

services:
  # ─── 1. OpenBot Web & Agent Engine (Next.js 15) ─────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: openbot-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://openbot_user:free_tier_secret_password@postgres:5432/openbot?schema=public
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
      - ADB_HOST=phone-bridge
      - ADB_PORT=5037
      - NEXT_PUBLIC_DOCKER_OS_URL=http://localhost:6080
      - NEXT_PUBLIC_DOCKER_BROWSER_URL=http://localhost:3002
      - NEXT_PUBLIC_PHONE_STREAM_URL=http://localhost:8000/stream
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ─── 2. Free Database (PostgreSQL 16) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: openbot-postgres
    restart: always
    environment:
      POSTGRES_USER: openbot_user
      POSTGRES_PASSWORD: free_tier_secret_password
      POSTGRES_DB: openbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot_user -d openbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 3. Free Cache / Queue (Redis 7) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: openbot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ─── 4. On-Device / Cloud Free LLM Engine (Ollama) ────────────
  ollama:
    image: ollama/ollama:latest
    container_name: openbot-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # ─── 5. Dockerized OS Desktop Sandbox (Full Ubuntu GUI + noVNC) ────
  os-desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: openbot-os-desktop
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUBFOLDER=/
      - TITLE=OpenBot OS Desktop
    ports:
      - "6080:3000"
    volumes:
      - os_desktop_data:/config
      - ../..:/workspace

  # ─── 6. Dockerized Browser Sandbox (Chromium + CDP) ───────────────
  browser-sandbox:
    image: browserless/chrome:latest
    container_name: openbot-browser-sandbox
    restart: unless-stopped
    ports:
      - "3002:3000"
      - "9222:9222"
    environment:
      - MAX_CONCURRENT_SESSIONS=5
      - CONNECTION_TIMEOUT=600000

  # ─── 7. Dockerized Phone Bridge (Physical USB ADB + Screen Stream)
  phone-bridge:
    build:
      context: ./docker/phone-bridge
      dockerfile: Dockerfile
    container_name: openbot-phone-bridge
    restart: unless-stopped
    privileged: true
    ports:
      - "5037:5037"
      - "5555:5555"
      - "8000:8000"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - WIRELESS_ADB_IP=${WIRELESS_ADB_IP:-}

volumes:
  postgres_data:
  redis_data:
  ollama_models:
  os_desktop_data:
