[package]
name = "openbot-desktop-engine"
version = "0.1.0"
description = "High-Performance Native OS Automation Engine for OpenBot Desktop"
edition = "2021"
authors = ["OpenBot Contributors"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"

# Native OS Control & Automation dependencies
enigo = { version = "0.2", default-features = false }
xcap = "0.0.14"
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
