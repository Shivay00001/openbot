services:
  # OpenBot Fullstack Web Application (Next.js 15)
  - type: web
    name: openbot-web
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --prefix packages/core && npm run build --prefix apps/web
    startCommand: npm run start --prefix apps/web
    healthCheckPath: /api/artemis
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: openbot-db
          property: connectionString
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434

  # Optional Backend API Gateway (NestJS)
  - type: web
    name: openbot-api-gateway
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --prefix packages/core && npm run build --prefix services/api-gateway
    startCommand: node services/api-gateway/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: openbot-db
          property: connectionString

# Free Managed PostgreSQL Database
databases:
  - name: openbot-db
    plan: free
    region: oregon
    databaseName: openbot
    user: openbot_user
